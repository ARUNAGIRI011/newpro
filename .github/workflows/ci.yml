name: production-hardening-validation
on:
  push:
    branches: [infra-sandbox-agent, production-hardening]
  pull_request:
    branches: [main]
jobs:
  go-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Build API
        working-directory: backend
        run: go build ./cmd/api
      - name: Unit tests
        working-directory: backend
        run: go test -race ./...
  python-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install UI dependencies
        working-directory: ui
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile ui/app.py
  adk-go-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Resolve dependencies and build ADK agent
        working-directory: adk-go-agent
        run: |
          go mod tidy
          go build ./...

  container-build:
    runs-on: ubuntu-latest
    env:
      SANDBOX_API_TOKEN: "ci-only-token-not-for-deployment-0123456789abcdef"
      GOOGLE_API_KEY: ""
      GEMINI_MODEL: "gemini-2.5-flash"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API image
        run: docker build --tag infra-sandbox-api:ci ./backend
      - name: Build UI image
        run: docker build --tag infra-sandbox-ui:ci ./ui
